apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: backend-virtualservice
spec:
  hosts:
  - backend
  http:
  - name: "v1"
    match:
    - headers:
        version:
          exact: v1
    route:
    - destination:
        host: backend
        subset: v1
        port:
          number: 8081
  - name: "v2"
    match:
    - headers:
        version:
          exact: v2
    route:
    - destination:
        host: backend
        subset: v2
        port:
          number: 8081
