apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        sermant-injection: enabled
    spec:
      containers:
        - name: gateway
          image: gateway:1.0.0
          imagePullPolicy: IfNotPresent
